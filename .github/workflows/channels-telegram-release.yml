name: channels-telegram-release

on:
  push:
    tags:
      - "channels-telegram-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example channels-telegram-v0.128.0-3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "${tag}" =~ ^channels-telegram-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] \
            || { echo "Invalid tag: ${tag}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset=codex-x86_64-unknown-linux-gnu-${tag}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@c2b55edffaf41a251c410bb32bed22afefa800f1 # 1.92

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcap-dev

      - name: Build codex
        working-directory: codex-rs
        run: cargo build -p codex-cli --release

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="${{ steps.release.outputs.asset }}"
          tar -C codex-rs/target/release -czf "dist/${asset}" codex
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Codex Channels Telegram build from ${GITHUB_SHA}.

          Includes:
          - Channels core support
          - Telegram Channel plugin marketplace entry
          - Telegram MCP bridge
          - Loop control tool and TUI loop runner fixes
          EOF

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

          gh release create "$TAG" \
            "dist/${ASSET}" \
            "dist/${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Codex Channels Telegram ${TAG#channels-telegram-v}" \
            --notes-file "$notes"
